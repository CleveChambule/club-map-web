<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12161E">
<link rel="icon" type="image/png" sizes="192x192" href="https://clubmapmz.github.io/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://clubmapmz.github.io/icon-180.png">
<title>ClubMap · DEMO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #12161E; --bg2: #1A202B; --card: #1E2530; --panel: #1A212C;
    --ink: #EDE6D6; --soft: #9A9080; --line: #2A3140;
    --accent: #C9552F; --brass: #C9A227;
    --livre: #43C98B; --res: #E5A33C; --ocu: #FF5C6C; --sel: #3EC6E0;
  }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }

  .app { display: flex; height: 100vh; min-height: 720px; overflow: hidden; }

  /* ---------- sidebar ---------- */
  .side { width: 240px; background: #0E1219; border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 12px; padding: 20px 18px 18px; border-bottom: 1px solid var(--bg2); }
  .logo b { font-size: 17px; font-weight: 800; letter-spacing: .5px; display: block; }
  .logo small { color: var(--soft); font-size: 10.5px; letter-spacing: .5px; }
  .nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav .it { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: var(--soft); font-size: 13.5px; font-weight: 600; cursor: pointer; border-left: 3px solid transparent; user-select: none; }
  .nav .it:hover { background: #151B24; }
  .nav .it.on { background: var(--card); border-left-color: var(--brass); color: var(--ink); font-weight: 700; }
  .nav .it.on svg { stroke: var(--brass); }
  .nav svg { stroke: var(--soft); flex-shrink: 0; }
  .user { margin: 14px; padding: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #33270F; border: 1px solid var(--brass); display: flex; align-items: center; justify-content: center; color: var(--brass); font-weight: 800; font-size: 13px; flex-shrink: 0; }
  .user b { font-size: 13px; display: block; }
  .user small { color: var(--brass); font-size: 11px; font-weight: 700; }

  /* ---------- layout ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 14px; padding: 14px 96px 14px 24px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .top h1 { font-size: 19px; font-weight: 800; }
  .top .sub { color: var(--soft); font-size: 12.5px; }
  .grow { flex: 1; }
  .body { flex: 1; overflow: auto; padding: 18px 24px 24px; }

  /* ---------- componentes ---------- */
  .btn { border: none; border-radius: 11px; padding: 11px 18px; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .btn.gold { background: var(--accent); color: #FFF1E8; }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.12); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); color: var(--soft); cursor: pointer; user-select: none; }
  .chip.on { border-color: var(--accent); background: #33221B; color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 14px; }
  .kpi { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .kpi.destq { border-color: var(--brass); }
  .kpi .lbl { color: var(--soft); font-size: 11px; font-weight: 700; letter-spacing: .8px; }
  .kpi .val { font-size: 30px; font-weight: 800; line-height: 1.25; }
  .kpi .val small { color: var(--soft); font-size: 14px; font-weight: 600; }
  .kpi .foot { font-size: 12px; font-weight: 700; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; }
  .card h3 { font-size: 15px; font-weight: 800; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; color: var(--soft); font-size: 10.5px; font-weight: 700; letter-spacing: .8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 11px 10px; border-bottom: 1px solid var(--card); font-size: 13px; white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: #1E2530; }
  .pill { display: inline-block; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 11px; }
  .pill.ok { background: #143326; color: var(--livre); }
  .pill.warn { background: #33270F; color: var(--res); }
  .pill.bad { background: #38141B; color: var(--ocu); }
  .tag-vip { background: #33270F; border: 1px solid var(--brass); border-radius: 999px; padding: 1px 8px; color: var(--brass); font-weight: 800; font-size: 10px; }
  .num { width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .num.l { background: #143326; color: var(--livre); }
  .num.r { background: #33270F; color: var(--res); }
  .num.o { background: #38141B; color: var(--ocu); }
  .hora { color: var(--brass); font-weight: 800; }
  input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; color: var(--ink); font: inherit; font-size: 14px; padding: 10px 12px; width: 100%; }
  input::placeholder { color: var(--soft); }
  label { display: block; color: var(--soft); font-size: 11px; font-weight: 700; letter-spacing: .8px; margin: 10px 0 4px; }

  /* ---------- modal / toast / ribbon ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
  .scrim.open { display: flex; }
  .modal { width: 440px; max-height: 86vh; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .modal .sub { color: var(--soft); font-size: 12.5px; margin-bottom: 8px; }
  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #1E2836; border: 1px solid var(--brass); color: var(--ink); padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 90; }
  #toast.show { opacity: 1; }
  .ribbon { position: fixed; top: 14px; right: -44px; transform: rotate(35deg); background: var(--accent); color: #FFF1E8; font-weight: 800; font-size: 12px; letter-spacing: 3px; padding: 6px 50px; z-index: 99; box-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; }

  .duas { display: flex; gap: 14px; align-items: flex-start; }
  @media (max-width: 1500px) {
    .hide-sm { display: none; }
    .duas .dir { width: 330px; }
  }
  /* telemóvel: navegação no topo, colunas empilhadas, planta a caber no ecrã */
  @media (max-width: 900px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .side { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
    .logo { padding: 12px 14px; }
    .nav { flex-direction: row; overflow-x: auto; padding: 6px 10px 10px; gap: 4px; }
    .nav .it { flex-shrink: 0; border-left: none; padding: 9px 12px; white-space: nowrap; }
    .nav .it.on { border-left: none; }
    .user { display: none; }
    #demoPrazo { margin: 0 14px 8px; }
    .side > div:has(.btn) { display: none; }
    .top { flex-wrap: wrap; padding: 12px 70px 12px 14px; gap: 10px; }
    .body { padding: 12px 12px 20px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px; }
    .kpi .val { font-size: 24px; }
    .duas { flex-direction: column; }
    .duas .dir { width: 100%; }
    .card { overflow-x: auto; }
    #body svg { max-width: 100%; height: auto; }
    .modal { width: calc(100vw - 28px); }
    .ribbon { top: 8px; right: -52px; font-size: 10px; padding: 5px 48px; }
  }
  .duas .esq { flex: 2; min-width: 0; overflow-x: auto; }
  .duas .dir { width: 380px; flex-shrink: 0; }

  /* timeline */
  .tl { display: flex; gap: 12px; }
  .tl .rail { display: flex; flex-direction: column; align-items: center; }
  .tl .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .tl .bar { width: 2px; flex: 1; background: var(--line); }
  .tl .txt { padding-bottom: 14px; flex: 1; }
  .tl .txt b { font-size: 13.5px; display: block; }
  .tl .txt small { color: var(--soft); font-size: 12px; }

  /* impressão: só o relatório */
  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; inset: 0; background: #fff; color: #111; padding: 24px; font-size: 13px; }
    #printArea h1 { font-size: 20px; margin-bottom: 2px; }
    #printArea .m { color: #555; margin-bottom: 14px; }
    #printArea table { width: 100%; border-collapse: collapse; }
    #printArea th, #printArea td { border-bottom: 1px solid #ccc; text-align: left; padding: 8px 6px; }
    #printArea .tot { margin-top: 14px; font-weight: 800; font-size: 15px; text-align: right; }
    .ribbon, #toast { display: none; }
  }
</style>
</head>
<body>
<div class="ribbon">DEMO</div>
<div id="toast"></div>

<div class="app">
  <!-- sidebar -->
  <div class="side">
    <div class="logo">
      <svg width="38" height="38" viewBox="0 0 108 108"><rect x="4" y="4" width="100" height="100" rx="26" fill="#0E1219" stroke="#2A3140" stroke-width="2"/><circle cx="84" cy="54" r="6.5" fill="#D9CCA9"/><circle cx="54" cy="84" r="6.5" fill="#D9CCA9"/><circle cx="24" cy="54" r="6.5" fill="#D9CCA9"/><circle cx="54" cy="24" r="6.5" fill="#D9CCA9"/><circle cx="54" cy="54" r="19" fill="#C9A227"/><circle cx="54" cy="54" r="12.5" fill="#1E2836"/><circle cx="54" cy="54" r="3.6" fill="#FFD98A"/></svg>
      <div><b>ClubMap</b><small>ARTS · CONSOLA DA CASA</small></div>
    </div>
    <div class="nav" id="nav">
      <div class="it" data-v="painel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Painel</div>
      <div class="it" data-v="mapa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 7v13"/><path d="M15 4v13"/></svg>Mapa da sala</div>
      <div class="it" data-v="reservas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>Reservas</div>
      <div class="it" data-v="clientes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 8h5"/><path d="M19.5 5.5v5"/></svg>Clientes</div>
      <div class="it" data-v="caixa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="3"/></svg>Caixa</div>
      <div class="it" data-v="arquivo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>Histórico de noites</div>
    </div>
    <div class="grow"></div>
    <div id="demoPrazo" style="margin: 0 14px 8px; text-align: center; color: var(--res); font-size: 11.5px; font-weight: 700"></div>
    <div style="margin: 0 14px 10px"><button class="btn ghost" style="width: 100%; font-size: 12px" onclick="reporDemo()">↺ Repor dados de demonstração</button></div>
    <div class="user"><div class="avatar">N</div><div><b>Neusa Matusse</b><small>RECEÇÃO</small></div></div>
  </div>

  <!-- conteúdo -->
  <div class="main">
    <div class="top" id="topbar"></div>
    <div class="body" id="body"></div>
  </div>
</div>

<!-- modal -->
<div class="scrim" id="scrim" onclick="if(event.target===this) fecharModal()"><div class="modal" id="modal"></div></div>
<div id="printArea"></div>

<script>
'use strict';
/* ============ dados (localStorage — sem servidor; na versão final: nuvem) ============ */
const LS = 'clubmap-demo-v3';
const MT = v => v.toLocaleString('pt-PT', {minimumFractionDigits: 2, maximumFractionDigits: 2}).replace(/\s/g, '.') + ' MT';
const hoje = new Date();
const pad = n => String(n).padStart(2, '0');
const isoHoje = hoje.getFullYear() + '-' + pad(hoje.getMonth() + 1) + '-' + pad(hoje.getDate());
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function dataPT(iso) { const d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ', ' + d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); }

function mesasBase() {
  /* numeração real da casa (igual à app de produção) */
  const m = [];
  m.push({n: 1, zona: 'VIP Room 1', lug: 12}, {n: 2, zona: 'VIP Room 2', lug: 10});
  [101, 103, 105, 107, 109, 111].forEach(n => m.push({n: n, zona: 'Lounge · 100', lug: 2}));
  [201, 203, 205, 207, 209, 211].forEach(n => m.push({n: n, zona: 'Lounge · 200', lug: 2}));
  for (let n = 301; n <= 306; n++) m.push({n: n, zona: 'Zona 300', lug: 4});
  for (let n = 401; n <= 406; n++) m.push({n: n, zona: 'Sunset', lug: (n === 401 || n === 404) ? 6 : 4});
  for (let n = 501; n <= 506; n++) m.push({n: n, zona: 'Sunset', lug: 4});
  for (let n = 601; n <= 606; n++) m.push({n: n, zona: 'Sunset', lug: n === 606 ? 7 : 4});
  [39, 40, 41].forEach(n => m.push({n: n, zona: 'Sofá em U · Lounge', lug: 5}));
  return m.sort((a, b) => a.n - b.n);
}
const OCUPADAS_SEED = {406: 'Sr. Carlos Macuácua · 4 p.', 103: 'Walk-in · 2 p.', 109: 'Walk-in · 2 p.', 203: 'Walk-in · 2 p.', 209: 'Walk-in · 2 p.', 302: 'Walk-in · 4 p.', 402: 'Walk-in · 2 p.', 502: 'Walk-in · 4 p.', 601: 'Walk-in · 4 p.', 604: 'Walk-in · 3 p.'};

function seed() {
  return {
    clientes: {
      '845123401': {nome: 'Anifa Momade', tel: '84 512 3401', vip: true, visitas: 12, ultima: '15 Ago 2026', consumo: 185000, notas: 'Prefere o VIP Room 2 · mesa longe da coluna de som.'},
      '827710045': {nome: 'Carlos Macuácua', tel: '82 771 0045', vip: false, visitas: 5, ultima: 'Hoje', consumo: 42500, notas: ''},
      '852047789': {nome: 'Élio Sitoe', tel: '85 204 7789', vip: false, visitas: 3, ultima: '08 Ago 2026', consumo: 30000, notas: ''},
      '841119020': {nome: 'Sr. Chambule', tel: '84 111 9020', vip: false, visitas: 2, ultima: '05 Ago 2026', consumo: 20000, notas: ''},
      '849331276': {nome: 'Marta Cumbe', tel: '84 933 1276', vip: false, visitas: 1, ultima: '02 Ago 2026', consumo: 10000, notas: ''},
    },
    reservas: [
      {id: 1, data: isoHoje, hora: '21:00', mesa: 305, tel: '849331276', pax: 4, valor: 10000, pago: true, pagoAs: '19:42'},
      {id: 2, data: isoHoje, hora: '21:30', mesa: 405, tel: '852047789', pax: 4, valor: 10000, pago: true, pagoAs: '18:15'},
      {id: 3, data: isoHoje, hora: '22:00', mesa: 2, tel: '845123401', pax: 8, valor: 10000, pago: true, pagoAs: '17:03'},
      {id: 4, data: isoHoje, hora: '23:00', mesa: 1, tel: '841119020', pax: 10, valor: 10000, pago: false, pagoAs: ''},
    ],
    proxId: 5,
    checkins: [],
  };
}
let DB;
try { DB = JSON.parse(localStorage.getItem(LS)) || seed(); } catch (e) { DB = seed(); }
function save() { try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) {} }
function reporDemo() { DB = seed(); save(); render(); toast('Dados de demonstração repostos'); }

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function naVersaoFinal() { toast('Disponível na versão final 😉'); }
function cliente(tel) { return DB.clientes[tel] || {nome: '(sem ficha)', tel: tel, vip: false}; }
function resHoje() { return DB.reservas.filter(r => r.data === isoHoje).sort((a, b) => a.hora.localeCompare(b.hora)); }
function resFuturas() { return DB.reservas.filter(r => r.data > isoHoje).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora)); }
function estadoMesa(n) {
  if (DB.checkins.includes(n) || OCUPADAS_SEED[n]) return 'ocupada';
  if (resHoje().some(r => r.mesa === n)) return 'reservada';
  return 'livre';
}
function quemNaMesa(n) {
  if (DB.checkins.includes(n)) { const r = resHoje().find(x => x.mesa === n); return r ? cliente(r.tel).nome + ' · ' + r.pax + ' p.' : 'Ocupada'; }
  if (OCUPADAS_SEED[n]) return OCUPADAS_SEED[n];
  const r = resHoje().find(x => x.mesa === n);
  return r ? cliente(r.tel).nome : '';
}
function stats() {
  const mesas = mesasBase();
  let l = 0, r = 0, o = 0;
  mesas.forEach(m => { const e = estadoMesa(m.n); if (e === 'livre') l++; else if (e === 'reservada') r++; else o++; });
  const rh = resHoje();
  const pagas = rh.filter(x => x.pago);
  return {total: mesas.length, livres: l, resv: r, ocup: o, nRes: rh.length, nPagas: pagas.length, caixa: pagas.reduce((s, x) => s + x.valor, 0), porCobrar: rh.filter(x => !x.pago).reduce((s, x) => s + x.valor, 0)};
}

/* ============ navegação ============ */
let vista = 'painel', filtroMesas = 'todas', pesquisaCli = '', cliSel = '845123401', arquivoAberto = false, noiteIdx = 0, periodoCaixa = 'hoje', mesasExpandido = false;
/* a demo desativa-se sozinha a partir desta data (ajustar ao publicar: dia de publicação + 10) */
const DEMO_EXPIRA = '2026-09-18';
document.querySelectorAll('#nav .it').forEach(it => it.addEventListener('click', () => {
  const v = it.dataset.v;
  if (v.startsWith('_')) { naVersaoFinal(); return; }
  vista = v; arquivoAberto = false; render();
}));

/* ============ render ============ */
function render() {
  if (isoHoje >= DEMO_EXPIRA) {
    document.querySelector('.app').innerHTML =
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center">' +
      '<svg width="72" height="72" viewBox="0 0 108 108"><rect x="4" y="4" width="100" height="100" rx="26" fill="#0E1219" stroke="#2A3140" stroke-width="2"/><circle cx="84" cy="54" r="6.5" fill="#D9CCA9"/><circle cx="54" cy="84" r="6.5" fill="#D9CCA9"/><circle cx="24" cy="54" r="6.5" fill="#D9CCA9"/><circle cx="54" cy="24" r="6.5" fill="#D9CCA9"/><circle cx="54" cy="54" r="19" fill="#C9A227"/><circle cx="54" cy="54" r="12.5" fill="#1E2836"/><circle cx="54" cy="54" r="3.6" fill="#FFD98A"/></svg>' +
      '<div style="font-size:24px;font-weight:800">Período de demonstração terminado</div>' +
      '<div style="color:var(--soft);font-size:14.5px;max-width:440px;line-height:1.6">Esta demonstração da Consola ClubMap chegou ao fim.<br>Para ativar a versão completa para a tua casa — com sincronização em tempo real, contas da equipa e arquivo na nuvem — fala connosco.</div>' +
      '</div>';
    return;
  }
  const dExp = new Date(DEMO_EXPIRA + 'T00:00:00');
  const resta = Math.max(0, Math.ceil((dExp - hoje) / 864e5));
  const prazo = $('demoPrazo');
  if (prazo) prazo.textContent = '⏳ Demo ativa — termina em ' + resta + ' dia' + (resta === 1 ? '' : 's');
  document.querySelectorAll('#nav .it').forEach(it => it.classList.toggle('on', it.dataset.v === vista));

}

function chipF(k, t) { return '<span class="chip' + (filtroMesas === k ? ' on' : '') + '" onclick="filtroMesas=\'' + k + '\';render()">' + t + '</span>'; }
function listaMesas() {

        ? '<button class="btn ghost" style="padding:7px 11px;font-size:12px" onclick="abrirNovaReserva(' + m.n + ')">Reservar</button>'
        : '<span style="color:var(--' + (m.e === 'ocupada' ? 'ocu' : 'res') + ');font-size:10.5px;font-weight:800">' + m.e.toUpperCase() + '</span>') +

function iniciais(nome) {
  const limpo = nome.replace(/\b(Sr\.?|Sra\.?|Dr\.?|Dra\.?|Dona|Mr\.?)\s*/gi, '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const p = limpo.split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p.length >= 2 ? p[0][0] + p[p.length - 1][0] : p[0].slice(0, 2)).toUpperCase();
}
function tabelaClientes(lista) {

    }).join('') + '</table>';
}

const PORDIA = {0: 9, 1: 0, 2: 6, 3: 11, 4: 14, 5: 26, 6: 30}; /* reservas típicas por dia da semana */
function histDias() {
  return [1, 2, 3, 4, 5, 6].map(k => {
    const d = new Date(hoje.getTime() - k * 864e5);
    const n = PORDIA[d.getDay()];
    return {d: DIAS[d.getDay()] + ', ' + d.getDate() + ' ' + MESES[d.getMonth()], n: n, v: n * 10000};
  });
}
function linhasPeriodo() {
  const s = stats();

  if (periodoCaixa === 'semana') return [hojeRow].concat(histDias());
  const sem = histDias();
  const totSem = sem.reduce((a, r) => a + r.v, 0) + s.caixa;
  const nSem = sem.reduce((a, r) => a + r.n, 0) + s.nPagas;
  return [
    {d: 'Semana 1 do mês', n: 88, v: 880000},
    {d: 'Semana 2 do mês', n: 96, v: 965000},
    {d: 'Semana 3 do mês', n: 104, v: 1040000},
    {d: 'Semana atual (até hoje)', n: nSem, v: totSem},

}

      const yE = -d.h / 2 + t / 2, xN = -(d.w / 2 - t / 2);

  }

}

/* planta com os estados ATUAIS da demo (para o Mapa da sala) */
function mesasComEstadoAtual() {
  return REAL.mesas.map(m => {
    const n = parseInt(m.label, 10);
    const reservavel = !isNaN(n) && mesasBase().some(x => x.n === n);
    return {l: m.label, t: m.tipo, x: m.x, y: m.y, r: m.rot, w: m.w, h: m.h, cad: m.cad, lug: m.lugares,
      e: P_DECOR[m.tipo] ? undefined : (reservavel ? estadoMesa(n) : 'livre')};
  });
}
/* planta de uma noite arquivada (estados estáveis gerados a partir da ocupação) */
function mesasNoite(pct, semente) {
  return REAL.mesas.map(m => {
    let e;
    if (!P_DECOR[m.tipo]) {
      const h = Math.abs(Math.round(m.x * 3 + m.y * 7 + semente * 131)) % 100;
      e = h < pct ? 'ocupada' : (h % 19 === 3 ? 'reservada' : 'livre');
    }
    return {l: m.label, t: m.tipo, x: m.x, y: m.y, r: m.rot, w: m.w, h: m.h, cad: m.cad, lug: m.lugares, e: e};
  });
}
function mesaClicada(l) {
  const n = parseInt(l, 10);
  if (isNaN(n) || !mesasBase().some(x => x.n === n)) return;
  const e = estadoMesa(n);
  if (e === 'livre') { abrirNovaReserva(n); return; }
  const quem = quemNaMesa(n);
  toast('Mesa ' + n + ' — ' + (e === 'ocupada' ? 'ocupada' : 'reservada') + (quem ? ': ' + quem : ''));
}

function marcarPago(id) {
  const r = DB.reservas.find(x => x.id === id);
  if (!r) return;
  const ag = new Date();
  r.pago = true; r.pagoAs = pad(ag.getHours()) + ':' + pad(ag.getMinutes());
  save(); render(); toast('Pagamento registado — ' + MT(r.valor) + ' na caixa 💰');
}
function checkin(mesa) {
  if (!DB.checkins.includes(mesa)) DB.checkins.push(mesa);
  save(); render(); toast('Check-in feito — mesa ' + mesa + ' ocupada. O tablet da sala já vê. ✓');
}

  if (!c) return;
  const nome = $('eNome').value.trim();
  if (!nome) { toast('Falta o nome do cliente'); return; }
  c.nome = nome;
  c.notas = $('eNotas').value.trim();
  c.vip = $('eVip').classList.contains('on');
  save(); fecharModal(); render();
  toast('Ficha atualizada ✓');
}
function abrirNovoCliente() {
  abrirModal('<h2>Novo cliente</h2><div class="sub">O telefone é o identificador — se já existir, a ficha abre em vez de duplicar.</div>' +
    '<label>TELEFONE</label><input id="cTel" placeholder="84 000 0000" maxlength="12">' +
    '<label>NOME COMPLETO</label><input id="cNome" placeholder="Ex.: Paulo Nhantumbo">' +
    '<label>NOTAS (OPCIONAL)</label><input id="cNotas" placeholder="Ex.: prefere zona VIP">' +
    '<div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" style="flex:1" onclick="fecharModal()">Cancelar</button>' +
    '<button class="btn gold" style="flex:1" onclick="guardarCliente()">Criar ficha</button></div>');
}
function guardarCliente() {
  const telRaw = $('cTel').value.replace(/\D/g, '');
  const nome = $('cNome').value.trim();
  if (telRaw.length < 9) { toast('Telefone inválido — 9 dígitos, ex.: 84 000 0000'); return; }
  if (!nome) { toast('Falta o nome do cliente'); return; }
  if (DB.clientes[telRaw]) {
    cliSel = telRaw; fecharModal(); vista = 'clientes'; render();
    toast('Esse telefone já tem ficha — sem duplicados 😉'); return;
  }
  DB.clientes[telRaw] = {nome: nome, tel: telRaw.replace(/(\d{2})(\d{3})(\d{4})/, '$1 $2 $3'), vip: false, visitas: 0, ultima: '—', consumo: 0, notas: $('cNotas').value.trim()};
  cliSel = telRaw; save(); fecharModal(); vista = 'clientes'; render();
  toast('Ficha criada — ' + nome + ' 🎉');
}

render();
</script>
</body>
</html>
